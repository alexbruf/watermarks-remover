[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wm-text = { path = "crates/wm-text" }
wm-image = { path = "crates/wm-image" }
wm-container = { path = "crates/wm-container" }
wm-av = { path = "crates/wm-av" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
